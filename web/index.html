<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smolmoe no navegador</title>
<meta name="description" content="Chat com um modelo de linguagem que roda inteiro no seu navegador, em WebAssembly. Nada sai do seu computador.">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #1f6f5c; --accent-text: #ffffff; --user: #e7f0ec; --notice: #8a8a83; --error: #a3302a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151614; --panel: #1d1f1c; --text: #ecece8; --muted: #a2a29b; --line: #2f322d;
      --accent: #57b39b; --accent-text: #0f1a16; --user: #22302b; --notice: #8d8d86; --error: #e0857f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151614; --panel: #1d1f1c; --text: #ecece8; --muted: #a2a29b; --line: #2f322d;
    --accent: #57b39b; --accent-text: #0f1a16; --user: #22302b; --notice: #8d8d86; --error: #e0857f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 760px; flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; min-height: 0; }
  header h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .setup h2 { margin: 0 0 4px; font-size: 1rem; }
  .setup p { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .file {
    font: inherit; border-radius: 8px; padding: 8px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .file input { display: none; }
  progress { width: 100%; height: 8px; margin-top: 12px; accent-color: var(--accent); }
  .status { color: var(--muted); font-size: 0.85rem; margin-top: 6px; min-height: 1.3em; }
  .error { color: var(--error); }
  #chat { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 0; min-height: 120px; }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px 12px; border-radius: 10px; max-width: 92%; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg.notice { align-self: flex-start; color: var(--notice); font: 0.8rem/1.4 ui-monospace, Consolas, monospace; padding: 0 4px; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; font: inherit; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  footer { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 0.8rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>smolmoe</h1>
    <p>Chat local no navegador: o modelo roda inteiro no seu computador, em WebAssembly. Nada do que você escreve sai daqui.</p>
  </header>

  <section class="panel setup" id="setup">
    <h2 id="model-name">Modelo</h2>
    <p id="model-help"></p>
    <div class="actions">
      <button class="primary" id="download" hidden>Baixar e abrir</button>
      <label class="file"><input type="file" id="file" accept=".smoe">Abrir arquivo .smoe</label>
    </div>
    <progress id="progress" max="1" value="0" hidden></progress>
    <div class="status" id="status"></div>
  </section>

  <section id="chat" hidden>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Escreva sua mensagem (Enter envia, Shift+Enter quebra a linha)" aria-label="Mensagem"></textarea>
      <button class="primary" id="send" type="submit">Enviar</button>
    </form>
    <footer>
      <span id="stats"></span>
      <button id="reset" type="button">Nova conversa</button>
    </footer>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
