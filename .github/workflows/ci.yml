name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every runner here has AVX2 or NEON: the kernel tests fail instead of skipping the SIMD comparisons.
env:
  SM_EXPECT_SIMD: "1"

jobs:
  # GCC's NEON headers on Linux ARM64 (the Mac job covers Clang): the unit tests, under QEMU.
  linux-arm64:
    name: linux-arm64 (gcc, emulated)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: unit tests
        run: |
          docker run --rm --platform linux/arm64 -e SM_EXPECT_SIMD -v "$PWD:/src" -w /src alpine:3.20 \
            sh -c 'apk add --no-cache build-base && make -j4 test-unit'

  linux:
    name: linux (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: build
        run: make -j4 CC=${{ matrix.cc }} all scalar
      # One job runs the real-model tests (Qwen goldens, chat memory); the rest skip them.
      - name: models
        if: matrix.cc == 'gcc'
        run: bun scripts/fetch-models.ts
        env:
          GH_TOKEN: ${{ github.token }}
      # The WebAssembly builds: kernels, logits and chat against the native ones (tests/wasm.test.ts),
      # and the browser page's engine through its own host code (tests/web.test.ts).
      - uses: mlugg/setup-zig@v2
        if: matrix.cc == 'gcc'
        with:
          version: 0.13.0
      - name: wasm
        if: matrix.cc == 'gcc'
        run: make -j4 wasi web
      - name: test
        run: make CC=${{ matrix.cc }} test
        env:
          SM_EXPECT_WASM: ${{ matrix.cc == 'gcc' && '1' || '' }}
      - name: sanitize
        run: make CC=${{ matrix.cc }} sanitize

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: build
        run: make -j4 all scalar
      # Real-model tests on Windows too: the chat tools and "!" in a real console.
      - name: models
        run: bun scripts/fetch-models.ts qwen2.5-0.5b-instruct tinystories-15m
        env:
          GH_TOKEN: ${{ github.token }}
      - name: test
        run: make test
      - name: release binary
        run: make release
      - uses: actions/upload-artifact@v6
        with:
          name: smolmoe-windows-x64
          path: |
            build/release/smolmoe.exe
            build/release/smolmoe-bundle.exe
            build/release/smolmoe-quantize.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      # Apple Silicon: NEON. The real-model tests check that NEON, --scalar and the scalar build give
      # identical logits; the A/B bench reports the speed against the scalar build (and fails if slower).
      - name: models
        run: bun scripts/fetch-models.ts qwen2.5-0.5b-instruct tinystories-15m
        env:
          GH_TOKEN: ${{ github.token }}
      - name: build and test
        run: make -j4 CC=clang test
      - name: NEON against scalar
        run: bun scripts/bench.ts --runs 3 --ab build/smolmoe-scalar
