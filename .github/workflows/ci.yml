name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every runner here has AVX2 or NEON: the kernel tests fail instead of skipping the SIMD comparisons.
env:
  SM_EXPECT_SIMD: "1"

jobs:
  # GCC's NEON headers on Linux ARM64 (the Mac job covers Clang): the unit tests, under QEMU.
  linux-arm64:
    name: linux-arm64 (gcc, emulated)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: unit tests
        run: |
          docker run --rm --platform linux/arm64 -e SM_EXPECT_SIMD -v "$PWD:/src" -w /src alpine:3.20 \
            sh -c 'apk add --no-cache build-base && make -j4 test-unit inventario'

  linux:
    name: linux (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: build
        run: make -j4 CC=${{ matrix.cc }} all scalar
      # Parsers of third-party model files. Clang's libFuzzer, a few seconds each.
      # The runner's clang does not always ship the fuzzer archive or libstdc++.
      - name: fuzz
        if: matrix.cc == 'clang'
        run: |
          ver=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get update -q && sudo apt-get install -y -q "libfuzzer-${ver}-dev" "libclang-rt-${ver}-dev" g++ libstdc++-14-dev
          make fuzz FUZZ_TIME=10
      # The desktop window against the system's GLFW (Win32 and Cocoa builds are in the other jobs).
      - name: desktop window
        if: matrix.cc == 'gcc'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libglfw3-dev
          make -j4 gui
      # The model aliases resolve (a dry run: no weights are bundled here).
      - name: make help and the model aliases
        if: matrix.cc == 'gcc'
        run: make help > /dev/null && make -n all-models > /dev/null
      # One job runs the real-model tests (Qwen goldens, chat memory); the rest skip them.
      - name: models
        if: matrix.cc == 'gcc'
        run: bun scripts/fetch-models.ts
        env:
          GH_TOKEN: ${{ github.token }}
      # The WebAssembly builds: kernels, logits and chat against the native ones (tests/wasm.test.ts),
      # and the browser page's engine through its own host code (tests/web.test.ts).
      - uses: mlugg/setup-zig@v2
        if: matrix.cc == 'gcc'
        with:
          version: 0.13.0
      - name: wasm
        if: matrix.cc == 'gcc'
        run: make -j4 wasi web
      - name: test
        run: make CC=${{ matrix.cc }} test
        env:
          SM_EXPECT_WASM: ${{ matrix.cc == 'gcc' && '1' || '' }}
          SM_EXPECT_GUI: ${{ matrix.cc == 'gcc' && '1' || '' }}
      # The defensive inventory is outside `all` and `test`; sanitize runs it too.
      - name: inventory
        run: make CC=${{ matrix.cc }} inventario
      - name: sanitize
        run: make CC=${{ matrix.cc }} sanitize

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
          path-type: inherit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: build
        run: make -j4 all scalar gui inventario
      # The same Makefile from PowerShell with native Windows make (mingw32-make), which has
      # no POSIX shell on PATH: the Makefile finds the one next to the compiler (docs/CAMINHOS.md).
      - name: build from PowerShell
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          mingw32-make help
          mingw32-make -j4 BUILD=build/pwsh all gui
          mingw32-make -n all-models
          ./build/pwsh/smolmoe.exe --version
          ./build/pwsh/smolmoe-gui.exe --version
      # Real-model tests on Windows too: the chat tools and "!" in a real console.
      - name: models
        run: bun scripts/fetch-models.ts qwen2.5-0.5b-instruct tinystories-15m
        env:
          GH_TOKEN: ${{ github.token }}
      - name: test
        run: make test
        env:
          SM_EXPECT_GUI: "1"
      - name: release binary
        run: make release release-gui
      - uses: actions/upload-artifact@v6
        with:
          name: smolmoe-windows-x64
          path: |
            build/release/smolmoe.exe
            build/release/smolmoe-bundle.exe
            build/release/smolmoe-quantize.exe
            build/release/smolmoe-gui.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      # Apple Silicon: NEON. The real-model tests check that NEON, --scalar and the scalar build give
      # identical logits; the A/B bench reports the speed against the scalar build (and fails if slower).
      - name: models
        run: bun scripts/fetch-models.ts qwen2.5-0.5b-instruct tinystories-15m
        env:
          GH_TOKEN: ${{ github.token }}
      - name: desktop window
        run: |
          brew install glfw
          make -j4 CC=clang gui
      # Apple's make is 3.81: the help and the model aliases must still resolve.
      - name: make help and the model aliases
        run: make help > /dev/null && make -n CC=clang all-models > /dev/null
      - name: build and test
        run: make -j4 CC=clang test inventario
        env:
          SM_EXPECT_GUI: "1"
      - name: NEON against scalar
        run: bun scripts/bench.ts --runs 3 --ab build/smolmoe-scalar
